<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BattleGround of Knowledge</title>
    <script type="module" src="homepage.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-b from-purple-900 via-gray-900 to-black min-h-screen text-gray-100 font-sans">

    <!-- Header -->
    <header class="bg-black/70 backdrop-blur-md p-6 shadow-lg text-center border-b border-gray-700">
        <h1 class="text-3xl md:text-5xl font-extrabold bg-gradient-to-r from-pink-400 to-purple-500 bg-clip-text text-transparent">Welcome to the BattleGround of Knowledge</h1>
    </header>

    <!-- Main Container -->
    <main class="flex flex-col items-center mt-10 px-4 md:px-20">
        <form name="submit-to-google-sheet" class="w-full max-w-4xl bg-gray-900/70 backdrop-blur-md rounded-2xl shadow-xl border border-gray-700 p-6 space-y-6">
            
            <!-- Hidden user info -->
            <div class="hidden">
                <textarea name="Name" id="loggedUserUsername"></textarea>
                <textarea name="Contact" id="loggedUserPhone"></textarea>
            </div>

            <!-- Quiz Container -->
            <div id="quiz-container" class="space-y-6"></div>

            <!-- Submit Button -->
            <button type="submit" id="submit-score" class="w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:scale-105 transform transition text-white font-bold py-3 rounded-xl shadow-lg">
                Submit Score
            </button>

            <p id="total-score" class="text-center text-lg font-semibold mt-4 text-gray-300"></p>
        </form>
    </main>

    <!-- Scripts -->
    <script src="main.js" async defer></script>
    <script>
    let score = 0;
    let sessionActive = false; // Only check fullscreen after quiz starts
    let sessionCheckInterval = null; // Store interval ID

    function checkAnswer(quizKey, userAnswer, correctAnswer) {
        sessionActive = true; // Start session checks after first answer
        
        // Start monitoring session only after first answer
        if (!sessionCheckInterval) {
            startSessionMonitoring();
        }
        
        const resultElement = document.getElementById(`result-${quizKey}`);
        if (userAnswer.toLowerCase() === correctAnswer.toLowerCase()) {
            score += 1;
            resultElement.textContent = 'Recorded';
            resultElement.className = 'text-pink-400 font-semibold mt-1';
        } else {
            resultElement.textContent = 'Recorded';
            resultElement.className = 'text-purple-400 font-semibold mt-1';
        }
    }

    // Start session monitoring (only called after first answer)
    function startSessionMonitoring() {
        sessionCheckInterval = setInterval(async () => {
            try {
                // Check if session is still active on server
                const res = await fetch('/check-session', { method: 'GET' });
                const data = await res.json();
                
                if (!data.active) {
                    // Session is disconnected, refresh page
                    console.log('Session inactive on server, refreshing...');
                    location.reload();
                }
            } catch (err) {
                // If error (e.g., network/server down), treat as disconnected
                console.log('Session check failed, refreshing...', err);
                location.reload();
            }
        }, 2000);
    }

    function autoSubmitAndEndSession() {
        if (!sessionActive) return;

        // Clear the session monitoring interval
        if (sessionCheckInterval) {
            clearInterval(sessionCheckInterval);
            sessionCheckInterval = null;
        }

        const currentTime = new Date().toLocaleString();
        const formData = {
            Name: document.getElementById('loggedUserUsername').value,
            Contact: document.getElementById('loggedUserPhone').value,
            Score: score,
            timestamp: currentTime
        };

        // Send data to backend
        fetch('/submit-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .finally(() => {
            // Save locally as backup
            localStorage.setItem('userName', formData.Name);
            localStorage.setItem('userContact', formData.Contact);
            localStorage.setItem('Score', score);
            // Redirect to session end
            window.location.href = 'session-end.html';
        });
    }

    function checkFullscreen() {
        if (!sessionActive) return; 
        if (window.innerHeight !== screen.height || window.innerWidth !== screen.width) {
            autoSubmitAndEndSession();
        }
    }

    document.addEventListener('visibilitychange', function() {
        if (!sessionActive) return;
        if (document.visibilityState !== 'visible') {
            console.log('Tab switched or minimized: visibilitychange');
            autoSubmitAndEndSession();
        }
    });

    window.addEventListener('blur', function() {
        if (!sessionActive) return;
        console.log('Tab switched or window lost focus: blur');
        autoSubmitAndEndSession();
    });

    window.addEventListener('resize', checkFullscreen);
    window.addEventListener('focus', checkFullscreen);

    // Quiz loader
    document.addEventListener('DOMContentLoaded', () => {
        fetch('/quizzes')
            .then(response => response.json())
            .then(data => {
                const quizContainer = document.getElementById('quiz-container');
                for (const key in data) {
                    if (data.hasOwnProperty(key)) {
                        const quiz = data[key];
                        const quizElement = document.createElement('div');
                        quizElement.className = "bg-gray-900/70 border border-gray-700 p-6 rounded-2xl shadow-lg space-y-4";
                        quizElement.innerHTML = `
                            <h2 class="text-xl md:text-2xl font-bold text-pink-400">Question: ${quiz.question}</h2>
                            <ul class="list-disc list-inside space-y-2 text-gray-300 ml-4">
                                <li>${quiz.options[0]}</li>
                                <li>${quiz.options[1]}</li>
                                <li>${quiz.options[2]}</li>
                                <li>${quiz.options[3]}</li>
                            </ul>
                            <input type="text" id="answer-${key}" placeholder="Type your answer here" class="w-full p-3 rounded-xl bg-black/70 border border-gray-700 text-gray-100 placeholder-gray-400 focus:border-pink-400 focus:outline-none transition">
                            <button type="button" onclick="checkAnswer('${key}', document.getElementById('answer-${key}').value, '${quiz.correctAnswer}')" class="mt-2 w-full bg-gradient-to-r from-pink-500 to-purple-600 hover:scale-105 transform text-white font-bold py-3 rounded-xl shadow-lg transition">
                                Submit Answer
                            </button>
                            <p id="result-${key}"></p>
                        `;
                        quizContainer.appendChild(quizElement);
                    }
                }
            })
            .catch(error => console.error('Error fetching quizzes:', error));
    });

    const form = document.forms['submit-to-google-sheet'];

    form.addEventListener('submit', e => {
        e.preventDefault();

        // Clear session monitoring when submitting
        if (sessionCheckInterval) {
            clearInterval(sessionCheckInterval);
            sessionCheckInterval = null;
        }

        const currentTime = new Date().toLocaleString();
        const formData = {
            Name: document.getElementById('loggedUserUsername').value,
            Contact: document.getElementById('loggedUserPhone').value,
            Score: score,
            timestamp: currentTime
        };

        fetch('/submit-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(formData)
        })
        .then(response => {
            if (response.ok) {
                alert('Score submitted successfully!');
                localStorage.setItem('userName', formData.Name);
                localStorage.setItem('userContact', formData.Contact);
                localStorage.setItem('Score', score);
                window.location.href = 'result';
            } else {
                throw new Error('Network response was not ok');
            }
        })
        .catch(error => {
            console.error('Error!', error.message);
            localStorage.setItem('userName', formData.Name);
            localStorage.setItem('userContact', formData.Contact);
            localStorage.setItem('Score', score);
            alert('Submission failed, but score saved locally!');
        });
    });

    // Clean up interval when page unloads
    window.addEventListener('beforeunload', function() {
        if (sessionCheckInterval) {
            clearInterval(sessionCheckInterval);
        }
    });
</script>

</body>
</html>
